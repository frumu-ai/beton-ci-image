name: Publish

# Builds the image and pushes it to ghcr.io/frumu-ai/beton-ci-image, tagged with the version in VERSION and "latest".
# CI pins a version tag, so publishing a new version changes nothing until a CI change asks for it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the versions
        id: versions
        run: |
          echo "image=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "sdk=$(cat DOTNET_SDK_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.versions.outputs.image }}
            DOTNET_SDK_VERSION=${{ steps.versions.outputs.sdk }}
          tags: |
            ghcr.io/frumu-ai/beton-ci-image:${{ steps.versions.outputs.image }}
            ghcr.io/frumu-ai/beton-ci-image:latest
          labels: |
            org.opencontainers.image.source=https://github.com/frumu-ai/beton-ci-image
            org.opencontainers.image.description=Ubuntu 24.04 with lavapipe, the Vulkan validation layer and the .NET SDK, for Beton's Linux CI
